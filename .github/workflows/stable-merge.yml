name: stable-merge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: stable-merge
  cancel-in-progress: false

env:
  BASE: bore-bbrv3-5.10
  UPSTREAM: https://android.googlesource.com/kernel/common
  UPSTREAM_BRANCH: android12-5.10-lts
  GH_TOKEN: ${{ github.token }}

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # scripts come from the default branch, so BASE doesn't need them
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          path: src
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - name: fetch full history of BASE only
        working-directory: src
        run: git fetch --no-tags --filter=blob:none --unshallow origin "$BASE"

      - name: detect new release
        id: detect
        working-directory: src
        run: |
          git fetch --no-tags --filter=blob:none "$UPSTREAM" "$UPSTREAM_BRANCH"
          sha=$(git rev-parse FETCH_HEAD)
          cur=$(awk '/^SUBLEVEL/{print $3; exit}' Makefile)
          up=$(git show "$sha:Makefile" | awk '/^SUBLEVEL/{print $3; exit}')
          echo "tree 5.10.$cur, $UPSTREAM_BRANCH 5.10.$up ($sha)"
          b="test-lts-5.10.$up"
          go=true
          [ "$up" -gt "$cur" ] || go=false
          git merge-base --is-ancestor "$sha" HEAD && go=false
          git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1 && go=false
          n=$(gh issue list --state all --search "merge 5.10.$up in:title" --json number -q 'length')
          [ "${n:-0}" -eq 0 ] || go=false
          echo "go=$go"   >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "up=$up"   >> "$GITHUB_OUTPUT"
          echo "branch=$b" >> "$GITHUB_OUTPUT"

      - name: merge
        id: merge
        if: steps.detect.outputs.go == 'true'
        working-directory: src
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ steps.detect.outputs.branch }}"
          set +e
          LABEL="$UPSTREAM_BRANCH" bash ../ci/.ci/merge-stable.sh "${{ steps.detect.outputs.sha }}" 2>&1 | tee ../merge.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: push and open PR
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '0'
        working-directory: src
        run: |
          b="${{ steps.detect.outputs.branch }}"
          git push origin "HEAD:refs/heads/$b"
          gh pr create --base "$BASE" --head "$b" \
            --title "Merge $UPSTREAM_BRANCH (5.10.${{ steps.detect.outputs.up }})" \
            --body "Not built yet. Wait for tester." || true

      - name: open issue on conflicts
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '10'
        run: |
          up=${{ steps.detect.outputs.up }}
          files=$(sed -n '/^conflicts left/,/^resolve/p' merge.log | grep '^  ')
          gh issue create --title "merge 5.10.$up has conflicts" --body "$(printf 'Files:\n\n```\n%s\n```\n\nFinish locally:\n\n```\ngit fetch origin && git fetch https://android.googlesource.com/kernel/common %s\ngit checkout -B %s origin/%s\nLABEL=%s .ci/merge-stable.sh %s\n```\n' "$files" "$UPSTREAM_BRANCH" "${{ steps.detect.outputs.branch }}" "$BASE" "$UPSTREAM_BRANCH" "${{ steps.detect.outputs.sha }}")"

      - name: fail on unexpected error
        if: steps.merge.outputs.rc != '' && steps.merge.outputs.rc != '0' && steps.merge.outputs.rc != '10'
        run: exit 1
