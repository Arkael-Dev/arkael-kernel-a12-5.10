name: stable-merge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "force a tag, e.g. v5.10.274 (empty = latest)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: stable-merge
  cancel-in-progress: false

env:
  BASE: bore-bbrv3-5.10
  UPSTREAM: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  GH_TOKEN: ${{ github.token }}

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          filter: blob:none

      - name: detect new release
        id: detect
        run: |
          cur=$(awk '/^SUBLEVEL/{print $3; exit}' Makefile)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --tags --refs "$UPSTREAM" 'refs/tags/v5.10.*' \
                  | awk -F/ '{print $3}' | sort -V | tail -1)
          fi
          new=${tag##*.}
          echo "tree 5.10.$cur, upstream $tag"
          go=true
          [ "$new" -gt "$cur" ] || go=false
          git ls-remote --exit-code --heads origin "test-5.10.$new" >/dev/null 2>&1 && go=false
          n=$(gh issue list --state all --search "merge $tag in:title" --json number -q 'length')
          [ "${n:-0}" -eq 0 ] || go=false
          echo "go=$go"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: merge
        id: merge
        if: steps.detect.outputs.go == 'true'
        run: |
          t=${{ steps.detect.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --filter=blob:none "$UPSTREAM" "refs/tags/$t:refs/tags/$t"
          git checkout -B "test-5.10.${{ steps.detect.outputs.new }}"
          set +e
          bash .ci/merge-stable.sh "$t" 2>&1 | tee merge.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: push and open PR
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '0'
        run: |
          b="test-5.10.${{ steps.detect.outputs.new }}"
          git push origin "HEAD:refs/heads/$b"
          gh pr create --base "$BASE" --head "$b" \
            --title "Merge ${{ steps.detect.outputs.tag }}" \
            --body "Stable merge. Not built yet, wait for tester." || true

      - name: open issue on conflicts
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '10'
        run: |
          t=${{ steps.detect.outputs.tag }}
          files=$(sed -n '/^conflicts left/,/^resolve/p' merge.log | grep '^  ')
          gh issue create --title "merge $t has conflicts" --body "$(printf 'Files:\n\n```\n%s\n```\n\nFinish locally:\n\n```\ngit fetch origin && git checkout -B test-5.10.%s origin/%s\n.ci/merge-stable.sh %s\n```\n' "$files" "${{ steps.detect.outputs.new }}" "$BASE" "$t")"

      - name: fail on unexpected error
        if: steps.merge.outputs.rc != '' && steps.merge.outputs.rc != '0' && steps.merge.outputs.rc != '10'
        run: exit 1
