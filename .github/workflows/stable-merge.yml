name: stable-merge

on:
  schedule:
    - cron: "17 * * * *"   # cheap check (~10s when Google has nothing new)
  workflow_dispatch:
    inputs:
      force:
        description: "run even if this Google commit was already handled"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: stable-merge
  cancel-in-progress: false

env:
  BASE: bore-bbrv3-5.10
  UPSTREAM: https://android.googlesource.com/kernel/common
  UPSTREAM_BRANCH: android12-5.10-lts
  KEEP_BRANCHES: arkael-linux-stable bore-bbrv3-5.10 arkael-bore arkael-bore-lts-merge
  AUTO_RESOLVE: ours

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # one cheap look at Google's tip; the cache remembers which tips were already handled
      - name: check Google tip
        id: tip
        run: |
          g=$(git ls-remote "$UPSTREAM" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$g" ] || { echo "cannot read $UPSTREAM_BRANCH"; exit 1; }
          echo "Google $UPSTREAM_BRANCH tip: $g"
          mkdir -p .seen && echo "$g" > .seen/sha
          echo "sha=$g" >> "$GITHUB_OUTPUT"

      - name: already handled?
        id: seen
        uses: actions/cache@v4
        with:
          path: .seen
          key: google-seen-${{ steps.tip.outputs.sha }}

      # scripts come from the default branch, so BASE doesn't need them
      - uses: actions/checkout@v4
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        with:
          path: ci
          sparse-checkout: .ci

      - uses: actions/checkout@v4
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        with:
          ref: ${{ env.BASE }}
          path: src
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - name: fetch branches
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        working-directory: src
        run: |
          # BASE: full history (needed for the merge)
          git fetch --no-tags --filter=blob:none --unshallow origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          # the rest: best effort, missing branches are skipped
          for b in $KEEP_BRANCHES; do
            [ "$b" = "$BASE" ] && continue
            git fetch --no-tags --filter=blob:none origin "+refs/heads/$b:refs/remotes/origin/$b" || echo "skip: $b not found"
          done

      - name: detect new commits from Google
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        id: detect
        working-directory: src
        run: |
          git fetch --no-tags --filter=blob:none "$UPSTREAM" "$UPSTREAM_BRANCH"
          sha=$(git rev-parse FETCH_HEAD)
          cur=$(awk '/^SUBLEVEL/{print $3; exit}' Makefile)
          up=$(git show "$sha:Makefile" | awk '/^SUBLEVEL/{print $3; exit}')
          new=$(git rev-list --count "HEAD..$sha")
          echo "tree 5.10.$cur, $UPSTREAM_BRANCH 5.10.$up ($sha), $new new commits"
          go=true
          [ "$new" -gt 0 ] || go=false
          echo "go=$go"   >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "up=$up"   >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      # merges straight into BASE (no test branch, no PR)
      - name: merge
        id: merge
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (steps.detect.outputs.go == 'true')
        working-directory: src
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          LABEL="$UPSTREAM_BRANCH" bash ../ci/.ci/merge-stable.sh "${{ steps.detect.outputs.sha }}" 2>&1 | tee ../merge.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: push to BASE
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (steps.detect.outputs.go == 'true' && (steps.merge.outputs.rc == '0' || steps.merge.outputs.rc == '11'))
        working-directory: src
        run: git push origin "HEAD:refs/heads/$BASE"

      - name: issue to review auto-resolved conflicts
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '11')
        uses: actions/github-script@v7
        env:
          UP: ${{ steps.detect.outputs.up }}
          SHA: ${{ steps.detect.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('merge.log', 'utf8').split('\n')
              .filter(l => l.startsWith('auto-resolved: ')).map(l => '- ' + l.slice(15)).join('\n');
            const short = process.env.SHA.slice(0, 12);
            await github.rest.issues.create({
              ...context.repo,
              title: `review: ${process.env.UPSTREAM_BRANCH} 5.10.${process.env.UP} (${short}) merged, conflicts auto-resolved`,
              body: `Merged into ${process.env.BASE}. These files had conflicts and were auto-resolved with \`${process.env.AUTO_RESOLVE}\`:\n\n${files}\n`,
            });

      - name: issue on unresolved conflicts
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '10')
        uses: actions/github-script@v7
        env:
          UP: ${{ steps.detect.outputs.up }}
          SHA: ${{ steps.detect.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const short = process.env.SHA.slice(0, 12);
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title ${short}`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) return;
            const log = fs.readFileSync('merge.log', 'utf8');
            const m = log.match(/conflicts left[\s\S]*?(?=\nresolve|$)/);
            await github.rest.issues.create({
              ...context.repo,
              title: `merge ${process.env.UPSTREAM_BRANCH} 5.10.${process.env.UP} (${short}) has conflicts`,
              body: '```\n' + (m ? m[0] : log.slice(-2000)) + '\n```',
            });

      - name: fail on unexpected error
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (steps.merge.outputs.rc != '' && steps.merge.outputs.rc != '0' && steps.merge.outputs.rc != '10' && steps.merge.outputs.rc != '11')
        run: exit 1
