name: stable-merge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: stable-merge
  cancel-in-progress: false

env:
  BASE: bore-bbrv3-5.10
  UPSTREAM: https://android.googlesource.com/kernel/common
  UPSTREAM_BRANCH: android12-5.10-lts
  KEEP_BRANCHES: arkael-linux-stable bore-bbrv3-5.10 arkael-bore test-5.10.273 arkael-bore-lts-merge
  AUTO_RESOLVE: ours
  GH_TOKEN: ${{ github.token }}

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # scripts come from the default branch, so BASE doesn't need them
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          path: src
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - name: fetch only the branches we use
        working-directory: src
        run: |
          args=()
          for b in $KEEP_BRANCHES; do
            args+=("+refs/heads/$b:refs/remotes/origin/$b")
          done
          git fetch --no-tags --filter=blob:none --unshallow origin "${args[@]}"

      - name: detect new commits from Google
        id: detect
        working-directory: src
        run: |
          git fetch --no-tags --filter=blob:none "$UPSTREAM" "$UPSTREAM_BRANCH"
          sha=$(git rev-parse FETCH_HEAD)
          cur=$(awk '/^SUBLEVEL/{print $3; exit}' Makefile)
          up=$(git show "$sha:Makefile" | awk '/^SUBLEVEL/{print $3; exit}')
          new=$(git rev-list --count "HEAD..$sha")
          echo "tree 5.10.$cur, $UPSTREAM_BRANCH 5.10.$up ($sha), $new new commits"
          go=true
          [ "$new" -gt 0 ] || go=false
          echo "go=$go"   >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "up=$up"   >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      # merges straight into BASE (no test branch, no PR)
      - name: merge
        id: merge
        if: steps.detect.outputs.go == 'true'
        working-directory: src
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          LABEL="$UPSTREAM_BRANCH" bash ../ci/.ci/merge-stable.sh "${{ steps.detect.outputs.sha }}" 2>&1 | tee ../merge.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: push to BASE
        if: steps.detect.outputs.go == 'true' && (steps.merge.outputs.rc == '0' || steps.merge.outputs.rc == '11')
        working-directory: src
        run: git push origin "HEAD:refs/heads/$BASE"

      - name: issue to review auto-resolved conflicts
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '11'
        run: |
          up=${{ steps.detect.outputs.up }}
          short=$(echo "${{ steps.detect.outputs.sha }}" | cut -c1-12)
          files=$(grep '^auto-resolved: ' merge.log | sed 's/^auto-resolved: /- /')
          gh issue create --title "review: $UPSTREAM_BRANCH 5.10.$up ($short) merged, conflicts auto-resolved" \
            --body "$(printf 'Merged into %s. These files had conflicts and were auto-resolved with `%s`:\n\n%s\n' "$BASE" "$AUTO_RESOLVE" "$files")"

      - name: issue on unresolved conflicts
        if: steps.detect.outputs.go == 'true' && steps.merge.outputs.rc == '10'
        run: |
          up=${{ steps.detect.outputs.up }}
          short=$(echo "${{ steps.detect.outputs.sha }}" | cut -c1-12)
          title="merge $UPSTREAM_BRANCH 5.10.$up ($short) has conflicts"
          n=$(gh issue list --state all --search "$short in:title" --json number -q 'length')
          [ "${n:-0}" -eq 0 ] || exit 0
          files=$(sed -n '/^conflicts left/,/^resolve/p' merge.log | grep '^  ')
          gh issue create --title "$title" --body "$(printf 'Files:\n\n```\n%s\n```\n' "$files")"

      - name: fail on unexpected error
        if: steps.merge.outputs.rc != '' && steps.merge.outputs.rc != '0' && steps.merge.outputs.rc != '10' && steps.merge.outputs.rc != '11'
        run: exit 1
